[project]
name = "training"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "mlflow>=2.12",
    "joblib>=1.4",
    "structlog>=24.1",
    "kagglehub>=0.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "imbalanced-learn>=0.12",
    "imblearn>=0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "ruff>=0.5",
    "jupyter>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
