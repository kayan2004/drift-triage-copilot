services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drift_triage
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [triage_net]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks: [triage_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "/mlruns", "--allowed-hosts", "*"]
    volumes:
      - mlflow_data:/mlruns
    networks: [triage_net]
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  model_train:
    build: ./training
    env_file: .env
    depends_on:
      mlflow:
        condition: service_healthy
    networks: [triage_net]
    restart: "no"
    profiles: ["train"]
    volumes:
      - ./training/train.py:/app/train.py:ro
      - ./training/reference_stats.json:/app/reference_stats.json

  db_migrate:
    build: ./model_service
    command: uv run alembic upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [triage_net]
    restart: "no"

  agent_migrate:
    build: ./agent
    command: uv run alembic upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [triage_net]
    restart: "no"

  model_service:
    build: ./model_service
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      db_migrate:
        condition: service_completed_successfully
    networks: [triage_net]
    ports: ["8000:8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build: ./agent
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model_service:
        condition: service_healthy
      agent_migrate:
        condition: service_completed_successfully
    networks: [triage_net]
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue_worker:
    build: ./agent
    command: uv run python -m app.queue.worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      model_service:
        condition: service_healthy
    networks: [triage_net]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    env_file: .env
    depends_on:
      model_service:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks: [triage_net]
    ports: ["8501:8501"]

volumes:
  postgres_data:
  redis_data:
  mlflow_data:

networks:
  triage_net:
    driver: bridge
