[project]
name = "dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35",
    "httpx>=0.27",
    "pydantic>=2.7",
    "redis>=5.0",
    "structlog>=24.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["S101"]
